<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restricted Transmission Terminal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #050505;
            color: #d1d1d1;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Background Glow */
        .ambient-bg {
            position: absolute;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, rgba(30, 10, 10, 0.4) 0%, rgba(5, 5, 5, 1) 70%);
            z-index: 1;
        }

        /* Scanline CRT Overlay */
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
            opacity: 0.6;
        }

        /* Dust Particle Canvas */
        canvas#dust {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            opacity: 0.3;
        }

        /* Main Viewport Container */
        .viewport {
            position: relative;
            z-index: 5;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* COMMON PAGE STYLES */
        .page {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            text-align: center;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .page.hidden {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
            position: absolute;
        }

        /* Geometric Diamond Logo */
        .logo-container {
            position: relative;
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .diamond-outer {
            width: 80px;
            height: 80px;
            border: 1px solid rgba(180, 180, 180, 0.4);
            transform: rotate(45deg);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
            transition: border-color 0.5s ease;
        }

        .diamond-inner {
            width: 52px;
            height: 52px;
            border: 1px solid rgba(100, 100, 100, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .diamond-core {
            width: 24px;
            height: 24px;
            background: radial-gradient(circle, #ff1e1e 0%, #8b0000 100%);
            box-shadow: 0 0 12px #ff1e1e, 0 0 25px rgba(255, 0, 0, 0.6);
            animation: heartbeat 1.6s infinite ease-in-out;
        }

        @keyframes heartbeat {
            0%, 28%, 70%, 100% { transform: scale(1); box-shadow: 0 0 10px #8b0000, 0 0 20px rgba(255, 0, 0, 0.3); }
            14% { transform: scale(1.3); box-shadow: 0 0 20px #ff2222, 0 0 40px rgba(255, 0, 0, 0.8); }
            42% { transform: scale(1.18); box-shadow: 0 0 15px #ff0000, 0 0 30px rgba(255, 0, 0, 0.6); }
        }

        .status-box {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 24px;
        }

        .status-text {
            font-size: 15px;
            letter-spacing: 5px;
            color: #c8c8c8;
            text-transform: uppercase;
        }

        .cursor {
            display: inline-block;
            width: 9px;
            height: 15px;
            background-color: #ff3333;
            margin-left: 5px;
            box-shadow: 0 0 8px #ff3333;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Headers & Instructions */
        .sub-header {
            font-size: 11px;
            letter-spacing: 6px;
            color: #666;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .sub-header::before, .sub-header::after {
            content: '';
            width: 40px;
            height: 1px;
            background-color: #333;
        }

        .instruction {
            font-size: 14px;
            letter-spacing: 5px;
            color: #ffffff;
            margin-bottom: 10px;
            text-align: center;
            text-transform: uppercase;
        }

        /* Action Buttons */
        .transmission-btn {
            width: 440px;
            padding: 16px 0;
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
            letter-spacing: 6px;
            text-transform: uppercase;
            border: 1px solid #ffffff;
            outline: none;
            background-color: #e6e6e6;
            color: #0a0a0a;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            transition: all 0.4s ease;
        }

        /* Disabled Button Style */
        .transmission-btn[disabled] {
            background-color: #1a1a1a;
            color: #444444;
            border-color: #333333;
            cursor: not-allowed;
            box-shadow: none;
            opacity: 0.5;
        }

        .transmission-btn:not([disabled]):hover {
            background-color: #ffffff;
            letter-spacing: 8px;
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.6);
        }

        /* PAGE 2: CODE ENTRY */
        .code-container {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
        }

        .code-box {
            width: 55px;
            height: 65px;
            background: rgba(15, 15, 15, 0.8);
            border: 1px solid #2a2a2a;
            color: #00ff66;
            font-family: 'Share Tech Mono', monospace;
            font-size: 24px;
            text-align: center;
            outline: none;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            transition: all 0.3s ease;
        }

        .code-box:focus {
            border-color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            background: rgba(25, 25, 25, 0.9);
        }

        /* PAGE 3: CRYPTIC WORD ENTRY */
        .secret-input-wrapper {
            position: relative;
            margin-bottom: 10px;
        }

        .word-box {
            width: 440px;
            padding: 18px 20px;
            background: rgba(12, 12, 12, 0.9);
            border: 1px solid #222;
            color: #00ff66;
            font-family: 'Share Tech Mono', monospace;
            font-size: 18px;
            letter-spacing: 4px;
            text-align: center;
            text-transform: uppercase;
            outline: none;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
            transition: all 0.4s ease;
        }

        .word-box:focus {
            border-color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.25), inset 0 0 10px rgba(0,0,0,0.9);
        }

        /* Error Flash Animations */
        @keyframes errorFlash {
            0%, 100% { border-color: #2a2a2a; }
            50% { border-color: #ff0000; box-shadow: 0 0 15px rgba(255, 0, 0, 0.5); }
        }

        .error-shake {
            animation: errorFlash 0.4s ease 2;
        }
    </style>
</head>
<body>

    <div class="ambient-bg"></div>
    <div class="scanlines"></div>
    <canvas id="dust"></canvas>

    <div class="viewport">
        <div id="page-1" class="page">
            <div class="logo-container">
                <div class="diamond-outer" id="outer-diamond">
                    <div class="diamond-inner">
                        <div class="diamond-core"></div>
                    </div>
                </div>
            </div>

            <div class="status-box">
                <span class="status-text" id="text-target"></span><span class="cursor" id="cursor"></span>
            </div>

            <button id="continue-btn" class="transmission-btn" disabled>CONTINUE</button>
        </div>

        <div id="page-2" class="page hidden">
            <div class="sub-header">RESTRICTED TRANSMISSION</div>
            <div class="instruction">TYPE IN THE CODE</div>

            <div class="code-container">
                <input type="text" maxlength="1" class="code-box" data-index="0" autofocus>
                <input type="text" maxlength="1" class="code-box" data-index="1">
                <input type="text" maxlength="1" class="code-box" data-index="2">
                <input type="text" maxlength="1" class="code-box" data-index="3">
                <input type="text" maxlength="1" class="code-box" data-index="4">
                <input type="text" maxlength="1" class="code-box" data-index="5">
                <input type="text" maxlength="1" class="code-box" data-index="6">
            </div>

            <button id="find-btn" class="transmission-btn">CONTINUE</button>
        </div>

        <div id="page-3" class="page hidden">
            <div class="sub-header">CLASSIFIED DIRECTIVE</div>
            <div class="instruction">ENTER THE SECRET WORD</div>

            <div class="secret-input-wrapper">
                <input type="text" id="word-input" class="word-box" placeholder="PHRASE REQUIRED" autocomplete="off" spellcheck="false">
            </div>

            <button id="unlock-btn" class="transmission-btn">CONTINUE</button>
        </div>
    </div>

    <script>
        const TARGET_PASSCODE = "3629148";
        const TARGET_SECRET_WORD = "archive";
        const TARGET_VIDEO_URL = "https://youtu.be/B0Vi2pjyMwc";

        // Particle Canvas
        const canvas = document.getElementById('dust');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for(let i=0; i<40; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.5,
                speedY: -Math.random() * 0.3 - 0.1
            });
        }

        function renderParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                p.y += p.speedY;
                if(p.y < 0) p.y = canvas.height;
            });
            requestAnimationFrame(renderParticles);
        }
        renderParticles();

        // Page 1 Typewriter Logic
        const textTarget = document.getElementById('text-target');
        const cursor = document.getElementById('cursor');
        const outerDiamond = document.getElementById('outer-diamond');
        const continueBtn = document.getElementById('continue-btn');

        function typeWriter(text, speed, callback) {
            let i = 0;
            textTarget.textContent = '';
            
            function type() {
                if (i < text.length) {
                    textTarget.textContent += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                } else if (callback) {
                    setTimeout(callback, 500);
                }
            }
            type();
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                typeWriter('ANALYZING...', 90, () => {
                    setTimeout(() => {
                        typeWriter('IDENTITY VERIFIED', 70, () => {
                            cursor.style.backgroundColor = '#00ff66';
                            cursor.style.boxShadow = '0 0 8px #00ff66';
                            outerDiamond.style.borderColor = 'rgba(255,255,255,0.8)';
                            
                            // Unlock button when IDENTITY VERIFIED finishes
                            continueBtn.disabled = false;
                        });
                    }, 400);
                });
            }, 500);
        });

        // Navigation & Logic Variables
        const page1 = document.getElementById('page-1');
        const page2 = document.getElementById('page-2');
        const page3 = document.getElementById('page-3');

        const findBtn = document.getElementById('find-btn');
        const unlockBtn = document.getElementById('unlock-btn');

        const codeInputs = document.querySelectorAll('.code-box');
        const wordInput = document.getElementById('word-input');

        // Transition: Page 1 -> Page 2
        continueBtn.addEventListener('click', () => {
            if (!continueBtn.disabled) {
                page1.classList.add('hidden');
                setTimeout(() => {
                    page2.classList.remove('hidden');
                    codeInputs[0].focus();
                }, 600);
            }
        });

        // Page 2 Auto-Focus Logic
        codeInputs.forEach((input, idx) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && idx < codeInputs.length - 1) {
                    codeInputs[idx + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && input.value === '' && idx > 0) {
                    codeInputs[idx - 1].focus();
                }
            });
        });

        // Transition: Page 2 -> Page 3
        findBtn.addEventListener('click', () => {
            let enteredCode = "";
            codeInputs.forEach(input => enteredCode += input.value);

            if (enteredCode === TARGET_PASSCODE) {
                page2.classList.add('hidden');
                setTimeout(() => {
                    page3.classList.remove('hidden');
                    wordInput.focus();
                }, 600);
            } else {
                codeInputs.forEach(input => input.classList.add('error-shake'));
                setTimeout(() => {
                    codeInputs.forEach(input => input.classList.remove('error-shake'));
                }, 800);
            }
        });

        // Page 3 Secret Word Verification & Redirection
        unlockBtn.addEventListener('click', () => {
            const userWord = wordInput.value.trim().toLowerCase();

            if (userWord === TARGET_SECRET_WORD) {
                window.open(TARGET_VIDEO_URL, '_blank');
            } else {
                wordInput.classList.add('error-shake');
                setTimeout(() => {
                    wordInput.classList.remove('error-shake');
                }, 800);
            }
        });
    </script>
</body>
</html>
